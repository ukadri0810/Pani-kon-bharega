<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Water Bottle Spin Wheel</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: Arial, sans-serif;
    background: #f4f7fb;
    color: #172033;
  }
  .app {
    width: min(92vw, 620px);
    text-align: center;
  }
  h1 { margin: 0 0 8px; font-size: clamp(26px, 6vw, 40px); }
  p { margin: 0 0 22px; color: #647084; }
  .wheel-wrap {
    position: relative;
    width: min(88vw, 500px);
    aspect-ratio: 1;
    margin: auto;
  }
  canvas {
    width: 100%;
    height: 100%;
    display: block;
    filter: drop-shadow(0 14px 20px rgba(0,0,0,.12));
  }
  .pointer {
    position: absolute;
    top: -4px;
    left: 50%;
    transform: translateX(-50%);
    width: 0;
    height: 0;
    border-left: 18px solid transparent;
    border-right: 18px solid transparent;
    border-top: 38px solid #e63946;
    z-index: 2;
    filter: drop-shadow(0 3px 3px rgba(0,0,0,.2));
  }
  button {
    margin-top: 26px;
    border: 0;
    border-radius: 12px;
    padding: 15px 34px;
    font-size: 18px;
    font-weight: 700;
    color: white;
    background: #1769e0;
    cursor: pointer;
    box-shadow: 0 7px 16px rgba(23,105,224,.25);
  }
  button:hover { background: #1258bf; }
  button:disabled { opacity: .6; cursor: not-allowed; }
  #result {
    min-height: 34px;
    margin-top: 20px;
    font-size: 24px;
    font-weight: 800;
  }
</style>
</head>
<body>
<div class="app">
  <h1>💧 Who Will Fill the Bottle?</h1>
  <p>Spin the wheel and let fate decide!</p>

  <div class="wheel-wrap">
    <div class="pointer"></div>
    <canvas id="wheel" width="700" height="700"></canvas>
  </div>

  <button id="spinBtn">SPIN THE WHEEL</button>
  <div id="result"></div>
</div>

<script>
const names = ["Pranay", "Rohan", "Vivek", "Gaus"];
const canvas = document.getElementById("wheel");
const ctx = canvas.getContext("2d");
const btn = document.getElementById("spinBtn");
const result = document.getElementById("result");

const colors = ["#4dabf7", "#ffd43b", "#69db7c", "#ff8787"];
let rotation = 0;
let spinning = false;

function drawWheel() {
  const cx = canvas.width / 2;
  const cy = canvas.height / 2;
  const radius = 320;
  const slice = (Math.PI * 2) / names.length;

  ctx.clearRect(0, 0, canvas.width, canvas.height);

  for (let i = 0; i < names.length; i++) {
    const start = rotation + i * slice;
    const end = start + slice;

    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.arc(cx, cy, radius, start, end);
    ctx.closePath();
    ctx.fillStyle = colors[i];
    ctx.fill();
    ctx.strokeStyle = "#fff";
    ctx.lineWidth = 7;
    ctx.stroke();

    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(start + slice / 2);
    ctx.textAlign = "right";
    ctx.textBaseline = "middle";
    ctx.fillStyle = "#172033";
    ctx.font = "bold 42px Arial";
    ctx.fillText(names[i], radius - 35, 0);
    ctx.restore();
  }

  // Center circle
  ctx.beginPath();
  ctx.arc(cx, cy, 48, 0, Math.PI * 2);
  ctx.fillStyle = "#fff";
  ctx.fill();
  ctx.strokeStyle = "#d9e0ea";
  ctx.lineWidth = 5;
  ctx.stroke();
}

function spin() {
  if (spinning) return;
  spinning = true;
  btn.disabled = true;
  result.textContent = "";

  const winner = Math.floor(Math.random() * names.length);
  const slice = (Math.PI * 2) / names.length;

  // Pointer is at the top (-PI/2). Make the selected slice land there.
  const targetAngle = -Math.PI / 2 - (winner + 0.5) * slice;
  const current = rotation;
  const normalizedTarget = targetAngle - current;
  const extraSpins = 6 + Math.floor(Math.random() * 3);
  const finalRotation = current + normalizedTarget + extraSpins * Math.PI * 2;

  const startTime = performance.now();
  const duration = 4200;

  function animate(now) {
    const progress = Math.min((now - startTime) / duration, 1);
    const eased = 1 - Math.pow(1 - progress, 4);
    rotation = current + (finalRotation - current) * eased;
    drawWheel();

    if (progress < 1) {
      requestAnimationFrame(animate);
    } else {
      spinning = false;
      btn.disabled = false;
      result.textContent = "💧 " + names[winner] + " is filling the bottle!";
    }
  }

  requestAnimationFrame(animate);
}

btn.addEventListener("click", spin);
drawWheel();
</script>
</body>
</html>
