<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>HydraSpin - Office Hydration Roulette</title>
<style>
  :root {
    --bg-base: #080d1a;
    --surface-glass: rgba(18, 28, 51, 0.75);
    --surface-border: rgba(99, 140, 255, 0.2);
    --neon-cyan: #00f0ff;
    --neon-purple: #9d4edd;
    --neon-coral: #ff3b6c;
    --neon-mint: #05ffa1;
    --neon-amber: #ffbe0b;
    --text-main: #f8fafc;
    --text-dim: #8fa0c2;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: radial-gradient(circle at 50% 10%, #152244 0%, #0c1427 45%, var(--bg-base) 100%);
    color: var(--text-main);
    padding: 16px;
    overflow-x: hidden;
  }

  .stage {
    width: min(100%, 540px);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
    position: relative;
    z-index: 2;
  }

  /* Header */
  .brand-pill {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 5px 16px;
    border-radius: 99px;
    background: rgba(0, 240, 255, 0.08);
    border: 1px solid rgba(0, 240, 255, 0.25);
    font-size: 11px;
    font-weight: 800;
    letter-spacing: 1.8px;
    text-transform: uppercase;
    color: var(--neon-cyan);
    box-shadow: 0 0 20px rgba(0, 240, 255, 0.15);
  }

  h1 {
    margin: 0;
    font-size: clamp(26px, 6vw, 36px);
    font-weight: 900;
    letter-spacing: -0.5px;
    background: linear-gradient(135deg, #ffffff 40%, var(--neon-cyan) 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    text-align: center;
  }

  /* Mode Segmented Control */
  .mode-switch {
    display: flex;
    background: rgba(10, 16, 31, 0.9);
    border: 1px solid var(--surface-border);
    padding: 4px;
    border-radius: 16px;
    width: 100%;
    max-width: 410px;
    gap: 4px;
    backdrop-filter: blur(12px);
  }

  .mode-tab {
    flex: 1;
    border: none;
    background: transparent;
    color: var(--text-dim);
    padding: 9px 12px;
    border-radius: 12px;
    font-size: 12px;
    font-weight: 800;
    letter-spacing: 0.4px;
    cursor: pointer;
    transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  .mode-tab.active {
    background: linear-gradient(135deg, rgba(0, 240, 255, 0.2), rgba(157, 78, 221, 0.25));
    border: 1px solid var(--neon-cyan);
    color: #ffffff;
    box-shadow: 0 4px 15px rgba(0, 240, 255, 0.2);
  }

  /* Series Tracker Bar */
  .series-hud {
    width: 100%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: var(--surface-glass);
    border: 1px solid var(--surface-border);
    padding: 10px 16px;
    border-radius: 14px;
    font-size: 12px;
    font-weight: 700;
  }

  .series-pill {
    background: rgba(255, 190, 11, 0.15);
    color: var(--neon-amber);
    border: 1px solid rgba(255, 190, 11, 0.3);
    padding: 3px 12px;
    border-radius: 20px;
  }

  .btn-reset {
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid rgba(255, 255, 255, 0.12);
    color: var(--text-dim);
    padding: 5px 12px;
    border-radius: 8px;
    font-size: 11px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.2s;
  }
  .btn-reset:hover { color: #fff; border-color: var(--neon-coral); }

  /* Player Input Box */
  .roster-card {
    width: 100%;
    background: var(--surface-glass);
    border: 1px solid var(--surface-border);
    backdrop-filter: blur(16px);
    border-radius: 16px;
    padding: 10px 12px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .roster-input-row {
    display: flex;
    gap: 8px;
  }

  .roster-input {
    flex: 1;
    background: rgba(8, 13, 26, 0.7);
    border: 1px solid var(--surface-border);
    border-radius: 12px;
    padding: 9px 14px;
    font-size: 13px;
    color: #fff;
    outline: none;
    transition: border-color 0.2s;
  }

  .roster-input:focus { border-color: var(--neon-cyan); }

  .add-btn {
    background: linear-gradient(135deg, var(--neon-cyan), #00a6fb);
    border: none;
    color: #040914;
    border-radius: 12px;
    padding: 0 18px;
    font-weight: 900;
    font-size: 13px;
    cursor: pointer;
    transition: transform 0.2s;
  }
  .add-btn:active { transform: scale(0.96); }

  .tags-list {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    max-height: 52px;
    overflow-y: auto;
  }

  .tag {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: rgba(255, 255, 255, 0.06);
    border: 1px solid rgba(255, 255, 255, 0.12);
    padding: 4px 10px;
    border-radius: 20px;
    font-size: 11px;
    font-weight: 700;
    color: #e2e8f0;
  }

  .tag-remove {
    cursor: pointer;
    opacity: 0.5;
    transition: opacity 0.15s;
  }
  .tag-remove:hover { opacity: 1; color: var(--neon-coral); }

  /* Wheel Viewport */
  .wheel-viewport {
    position: relative;
    width: min(84vw, 385px);
    aspect-ratio: 1;
    margin: 4px 0;
  }

  .halo-ring {
    position: absolute;
    inset: -14px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(0, 240, 255, 0.18) 0%, rgba(157, 78, 221, 0.12) 45%, transparent 72%);
    filter: blur(12px);
    z-index: 1;
    pointer-events: none;
  }

  canvas#wheelCanvas {
    position: relative;
    z-index: 2;
    width: 100%;
    height: 100%;
    filter: drop-shadow(0 20px 40px rgba(0, 0, 0, 0.7));
  }

  /* Pointer Mech */
  .pointer-mech {
    position: absolute;
    top: -10px;
    left: 50%;
    transform: translateX(-50%);
    width: 34px;
    height: 48px;
    z-index: 10;
    pointer-events: none;
    transform-origin: 50% 10px;
    filter: drop-shadow(0 8px 14px rgba(0,0,0,0.8));
    transition: transform 0.05s ease-out;
  }

  .pointer-mech.bump {
    transform: translateX(-50%) rotate(-24deg) scale(1.12);
  }

  /* Spin Button */
  .action-wrap {
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
  }

  .spin-btn {
    position: relative;
    width: 100%;
    max-width: 360px;
    padding: 16px 24px;
    border: none;
    border-radius: 16px;
    background: linear-gradient(135deg, var(--neon-cyan) 0%, #0096c7 50%, var(--neon-purple) 100%);
    color: #ffffff;
    font-size: 17px;
    font-weight: 900;
    letter-spacing: 1px;
    text-transform: uppercase;
    cursor: pointer;
    box-shadow: 0 10px 30px rgba(0, 240, 255, 0.35), inset 0 2px 2px rgba(255, 255, 255, 0.5);
    transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
    overflow: hidden;
  }

  .spin-btn::after {
    content: '';
    position: absolute;
    top: 0; left: -100%; width: 50%; height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.45), transparent);
    transform: skewX(-20deg);
    animation: shine 3.5s infinite;
  }

  @keyframes shine {
    20%, 100% { left: 160%; }
  }

  .spin-btn:hover:not(:disabled) {
    transform: translateY(-2px) scale(1.02);
    box-shadow: 0 14px 40px rgba(0, 240, 255, 0.5);
  }

  .spin-btn:active:not(:disabled) {
    transform: translateY(2px) scale(0.98);
  }

  .spin-btn:disabled {
    filter: grayscale(0.8);
    opacity: 0.5;
    cursor: not-allowed;
  }

  .status-text {
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.8px;
    color: var(--text-dim);
    min-height: 16px;
  }

  /* Point Grid */
  .points-board {
    width: 100%;
    background: var(--surface-glass);
    border: 1px solid var(--surface-border);
    backdrop-filter: blur(16px);
    border-radius: 16px;
    padding: 12px 14px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .board-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 11px;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 1.2px;
    color: var(--neon-cyan);
  }

  .player-point-list {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(110px, 1fr));
    gap: 8px;
  }

  .player-point-card {
    position: relative;
    background: rgba(10, 16, 31, 0.7);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 12px;
    padding: 10px 8px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
    transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  .player-point-card.highlight {
    border-color: var(--neon-cyan);
    transform: scale(1.05);
    box-shadow: 0 0 20px rgba(0, 240, 255, 0.3);
  }

  .p-name {
    font-size: 12px;
    font-weight: 800;
    color: #fff;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 100%;
  }

  .p-score {
    font-size: 22px;
    font-weight: 900;
    color: var(--neon-amber);
    line-height: 1;
  }

  .p-bar-bg {
    width: 100%;
    height: 4px;
    background: rgba(255, 255, 255, 0.08);
    border-radius: 4px;
    overflow: hidden;
    margin-top: 3px;
  }

  .p-bar-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--neon-cyan), var(--neon-purple));
    width: 0%;
    transition: width 0.4s ease;
  }

  .point-float {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    color: var(--neon-cyan);
    font-weight: 900;
    font-size: 17px;
    pointer-events: none;
    animation: floatUp 0.8s forwards cubic-bezier(0.16, 1, 0.3, 1);
    text-shadow: 0 0 10px rgba(0, 240, 255, 0.8);
  }

  @keyframes floatUp {
    0% { transform: translate(-50%, 0) scale(0.5); opacity: 0; }
    30% { transform: translate(-50%, -15px) scale(1.3); opacity: 1; }
    100% { transform: translate(-50%, -35px) scale(1); opacity: 0; }
  }

  /* Shayari Dialog Modal */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(4, 8, 18, 0.85);
    backdrop-filter: blur(14px);
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.35s cubic-bezier(0.16, 1, 0.3, 1);
  }

  .modal-overlay.open {
    opacity: 1;
    pointer-events: auto;
  }

  .shayari-card {
    width: min(100%, 460px);
    background: linear-gradient(180deg, #162444 0%, #0d1527 100%);
    border: 1px solid var(--surface-border);
    border-radius: 24px;
    padding: 28px 22px;
    text-align: center;
    box-shadow: 0 30px 70px rgba(0, 0, 0, 0.9), 0 0 40px rgba(0, 240, 255, 0.15);
    transform: scale(0.85) translateY(25px);
    transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  .modal-overlay.open .shayari-card {
    transform: scale(1) translateY(0);
  }

  .victim-avatar {
    width: 60px;
    height: 60px;
    margin: 0 auto 10px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--neon-cyan), var(--neon-purple));
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 30px;
    box-shadow: 0 0 25px rgba(0, 240, 255, 0.4);
  }

  .victim-name {
    font-size: 28px;
    font-weight: 900;
    letter-spacing: -0.5px;
    color: #fff;
    margin: 0 0 2px;
  }

  .victim-badge {
    display: inline-block;
    padding: 4px 14px;
    border-radius: 50px;
    background: rgba(0, 240, 255, 0.1);
    border: 1px solid rgba(0, 240, 255, 0.3);
    color: var(--neon-cyan);
    font-size: 11px;
    font-weight: 800;
    letter-spacing: 1px;
    text-transform: uppercase;
    margin-bottom: 16px;
  }

  .shayari-box {
    background: rgba(8, 14, 28, 0.65);
    padding: 18px;
    border-radius: 16px;
    border: 1px solid rgba(255, 255, 255, 0.08);
    margin-bottom: 22px;
    position: relative;
  }

  .shayari-box::before {
    content: '“';
    position: absolute;
    top: -10px;
    left: 14px;
    font-size: 40px;
    color: var(--neon-cyan);
    font-family: Georgia, serif;
    opacity: 0.5;
  }

  .shayari-line1 {
    font-size: 15px;
    font-weight: 700;
    color: #f1f5f9;
    line-height: 1.5;
    margin-bottom: 6px;
  }

  .shayari-line2 {
    font-size: 15px;
    font-weight: 800;
    color: var(--neon-cyan);
    line-height: 1.5;
  }

  .modal-btn-row {
    display: flex;
    gap: 10px;
  }

  .btn-modal {
    flex: 1;
    padding: 13px;
    border-radius: 12px;
    font-size: 13px;
    font-weight: 800;
    cursor: pointer;
    border: none;
    transition: transform 0.15s;
  }

  .btn-modal:active { transform: scale(0.96); }

  .btn-close {
    background: linear-gradient(135deg, var(--neon-cyan), #0096c7);
    color: #040914;
  }

  .btn-copy {
    background: rgba(255, 255, 255, 0.08);
    color: #fff;
    border: 1px solid rgba(255, 255, 255, 0.15);
  }

  canvas#fxCanvas {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 105;
  }

  .shake {
    animation: camShake 0.45s cubic-bezier(0.36, 0.07, 0.19, 0.97) both;
  }

  @keyframes camShake {
    10%, 90% { transform: translate3d(-2px, 0, 0); }
    20%, 80% { transform: translate3d(3px, 0, 0); }
    30%, 50%, 70% { transform: translate3d(-5px, 0, 0); }
    40%, 60% { transform: translate3d(5px, 0, 0); }
  }
</style>
</head>
<body>

<canvas id="fxCanvas"></canvas>

<div class="stage" id="stage">
  <div class="brand-pill">💧 Water Refill Mission</div>
  <h1>Wheel of Bakra</h1>

  <!-- Mode Switcher -->
  <div class="mode-switch">
    <button class="mode-tab active" id="tabInstant">⚡ Single Spin (Instant)</button>
    <button class="mode-tab" id="tabSeries">🎯 10-Spins Match</button>
  </div>

  <!-- Series HUD -->
  <div class="series-hud" id="seriesHud" style="display: none;">
    <div>Round: <span class="series-pill" id="spinCounterPill">0 / 10</span></div>
    <div style="font-size: 11px; color: var(--text-dim);">Max points = Ultimate Bakra!</div>
    <button class="btn-reset" id="resetSeriesBtn">↺ Reset</button>
  </div>

  <!-- Team Roster Input -->
  <div class="roster-card">
    <div class="roster-input-row">
      <input type="text" id="nameInput" class="roster-input" placeholder="Add teammate name..." maxlength="14">
      <button class="add-btn" id="addBtn">+ Add</button>
    </div>
    <div class="tags-list" id="tagsList"></div>
  </div>

  <!-- Modern Aurora Canvas Wheel -->
  <div class="wheel-viewport">
    <div class="halo-ring"></div>
    <div class="pointer-mech" id="pointerMech">
      <svg viewBox="0 0 34 48" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M17 48L3 14C1 8 5 0 12 0H22C29 0 33 8 31 14L17 48Z" fill="url(#ptrNeon)"/>
        <circle cx="17" cy="14" r="5" fill="#ffffff" filter="drop-shadow(0 0 6px #00f0ff)"/>
        <defs>
          <linearGradient id="ptrNeon" x1="17" y1="0" x2="17" y2="48" gradientUnits="userSpaceOnUse">
            <stop stop-color="#00F0FF"/>
            <stop offset="0.6" stop-color="#0072FF"/>
            <stop offset="1" stop-color="#001F54"/>
          </linearGradient>
        </defs>
      </svg>
    </div>
    <canvas id="wheelCanvas" width="800" height="800"></canvas>
  </div>

  <!-- Actions -->
  <div class="action-wrap">
    <button class="spin-btn" id="spinBtn">SPIN THE WHEEL 🎲</button>
    <div class="status-text" id="statusText">Kiski kismat chamakne wali hai?</div>
  </div>

  <!-- Leaderboard -->
  <div class="points-board">
    <div class="board-header">
      <span id="boardTitle">Live Scoreboard</span>
      <span style="font-size: 10px; color: var(--neon-cyan);">+1 Pt on hit</span>
    </div>
    <div class="player-point-list" id="pointGrid"></div>
  </div>
</div>

<!-- Rhyme Modal -->
<div class="modal-overlay" id="modalOverlay">
  <div class="shayari-card">
    <div class="victim-avatar" id="modalAvatar">🐐</div>
    <h2 class="victim-name" id="modalVictim">Rohan</h2>
    <div class="victim-badge" id="modalBadge">Official Jal Mantri</div>
    
    <div class="shayari-box">
      <div class="shayari-line1" id="shayariLine1">Nazar lagi wheel par, dharak raha tha dil,</div>
      <div class="shayari-line2" id="shayariLine2">Botal uthao dost, aur chup chaap karo fill! 💧🚰</div>
    </div>

    <div class="modal-btn-row">
      <button class="btn-modal btn-copy" id="copyBtn">Copy Shayari 📋</button>
      <button class="btn-modal btn-close" id="closeModalBtn">Duty Par Chale 🏃‍♂️</button>
    </div>
  </div>
</div>

<script>
// --- ROSTER & MODERN PALETTE ENGINE ---
let roster = ["Pranay", "Rohan", "Vivek", "Gaus"];
let scores = { "Pranay": 0, "Rohan": 0, "Vivek": 0, "Gaus": 0 };

const THEME_SLICES = [
  { c1: "#00f0ff", c2: "#0072ff", accent: "#70e000" }, // Cyan - Blue
  { c1: "#ff007f", c2: "#7928ca", accent: "#ffbe0b" }, // Magenta - Violet
  { c1: "#05ffa1", c2: "#008f7a", accent: "#00f0ff" }, // Mint - Teal
  { c1: "#ffbe0b", c2: "#fb5607", accent: "#ff007f" }, // Amber - Sunset
  { c1: "#7209b7", c2: "#3a0ca3", accent: "#4cc9f0" }, // Purple - Deep Indigo
  { c1: "#4cc9f0", c2: "#4361ee", accent: "#f72585" }  // Electric Sky - Royal Blue
];

// --- WITTY & CLEAN HINGLISH SHAYARIS ---
const instantShayaris = [
  {
    l1: "Nazar lagi wheel par, dharak raha tha dil,",
    l2: "Botal uthao dost, aur chup chaap karo fill! 💧🚰"
  },
  {
    l1: "Slack par 'In a meeting' ka status hai purana,",
    l2: "Purifier bula raha hai, ab botal bhar ke aana! 🏃‍♂️💨"
  },
  {
    l1: "Code tera super hit hai, style tera chill,",
    l2: "Thanda paani laane me dikha de apna skill! 💻⚡"
  },
  {
    l1: "Chair se chipak ke baithe the janaab-e-aali,",
    l2: "Utho botal bharo jaldi, desk pe hai sab khali! 🪑✨"
  },
  {
    l1: "Screen ko ghoorne se pyaas nahi bujhegi bhai,",
    l2: "Filter ki ore chalke kismat ki karo bhalai! 🚶‍♂️🧊"
  },
  {
    l1: "Chalta nahi bahaana yahan, na chalti thakan,",
    l2: "Pantry se paani laao, khush ho sabka mann! 🚰🙌"
  },
  {
    l1: "Tu soch raha tha bachna aasan hoga aaj,",
    l2: "Wheel ne pehna diya tumhe 'Jal Mantri' ka taaj! 👑🌊"
  },
  {
    l1: "Keyboard pe ungliyan naach rahi thin tez,",
    l2: "RO filter tak chalke jeet lo yeh race! ⌨️🏆"
  },
  {
    l1: "Puri team ki umeedon ka khil gaya gulab,",
    l2: "Thanda paani lake hero karo lajawaab! 🧊🌹"
  },
  {
    l1: "Aasman me chamakte hain sitare hazaar,",
    l2: "Aaj paani laane ko hamara dost hai taiyyar! 🌟🚰"
  }
];

const finaleShayaris = [
  {
    l1: "10 rounds ke match me score kiya sabse bhaari,",
    l2: "Points table pe top karke mili botal bharne ki baari! 🏆🚰"
  },
  {
    l1: "Points table par chadh gaye jaise koi superstar,",
    l2: "Cooler refill karne ki zimmedari hai ab aap par sarkar! 👑💧"
  },
  {
    l1: "Khel me sabne lagayi thi apni poori jaan,",
    l2: "Score jeet ke ban gaye tum sabse bade mehmaan! 🌟🙌"
  }
];

// --- GAME STATE ---
let currentMode = "instant";
const SERIES_MAX_SPINS = 10;
let currentSpinCount = 0;

// --- DOM REFS ---
const canvas = document.getElementById("wheelCanvas");
const ctx = canvas.getContext("2d");
const fxCanvas = document.getElementById("fxCanvas");
const fxCtx = fxCanvas.getContext("2d");
const pointerMech = document.getElementById("pointerMech");

const shayariLine2 = document.getElementById("shayariLine2");

// --- SYNTHETIC WEB AUDIO ENGINE ---
let audioCtx = null;

function ensureAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
}

function playHapticTick(pitch = 560) {
  if (!audioCtx) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  
  osc.type = "sine";
  osc.frequency.setValueAtTime(pitch, audioCtx.currentTime);
  osc.frequency.exponentialRampToValueAtTime(70, audioCtx.currentTime + 0.035);

  gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.035);

  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start();
  osc.stop(audioCtx.currentTime + 0.035);
}

function playWinFanfare(isGrand = false) {
  if (!audioCtx) return;
  const freqs = isGrand ? [261.63, 329.63, 392.00, 523.25, 659.25, 783.99] : [329.63, 415.30, 493.88, 659.25];
  freqs.forEach((freq, i) => {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = isGrand ? "sawtooth" : "triangle";
    osc.frequency.value = freq;
    
    const start = audioCtx.currentTime + i * 0.07;
    gain.gain.setValueAtTime(0.22, start);
    gain.gain.exponentialRampToValueAtTime(0.001, start + (isGrand ? 0.8 : 0.45));

    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start(start);
    osc.stop(start + (isGrand ? 0.8 : 0.45));
  });
}

// --- CANVAS HIGH DPI RENDERING ---
let rotation = 0;
let isSpinning = false;
let lastSliceIndex = -1;
let pinAngleOffset = 0;

function setupCanvasDPI() {
  const dpr = window.devicePixelRatio || 1;
  canvas.width = 800 * dpr;
  canvas.height = 800 * dpr;
  ctx.scale(dpr, dpr);
}

function drawWheel() {
  const size = 800;
  const cx = size / 2;
  const cy = size / 2;
  const radius = 340;
  const numSlices = roster.length;
  const slice = (Math.PI * 2) / numSlices;

  ctx.clearRect(0, 0, size, size);

  // 1. Base Ring
  ctx.beginPath();
  ctx.arc(cx, cy, radius + 16, 0, Math.PI * 2);
  ctx.fillStyle = "#0c1427";
  ctx.fill();

  // 2. Wheel Slices
  for (let i = 0; i < numSlices; i++) {
    const startAngle = rotation + i * slice;
    const endAngle = startAngle + slice;
    const theme = THEME_SLICES[i % THEME_SLICES.length];

    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.arc(cx, cy, radius, startAngle, endAngle);
    ctx.closePath();

    const grad = ctx.createRadialGradient(cx, cy, 30, cx, cy, radius);
    grad.addColorStop(0, theme.c1);
    grad.addColorStop(0.7, theme.c2);
    grad.addColorStop(1, "#070c18");
    ctx.fillStyle = grad;
    ctx.fill();

    // Divider Line
    ctx.strokeStyle = "rgba(255, 255, 255, 0.2)";
    ctx.lineWidth = 3;
    ctx.stroke();

    // Name Text
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(startAngle + slice / 2);
    ctx.textAlign = "right";
    ctx.textBaseline = "middle";
    
    ctx.fillStyle = "#ffffff";
    ctx.font = "900 34px system-ui, -apple-system, sans-serif";
    ctx.shadowColor = "rgba(0,0,0,0.85)";
    ctx.shadowBlur = 10;
    ctx.fillText(roster[i], radius - 55, 0);

    // Accent Pip
    ctx.beginPath();
    ctx.arc(radius - 22, 0, 4.5, 0, Math.PI * 2);
    ctx.fillStyle = theme.accent;
    ctx.fill();
    ctx.restore();
  }

  // 3. Titanium Outer Bezel
  ctx.beginPath();
  ctx.arc(cx, cy, radius + 2, 0, Math.PI * 2);
  ctx.lineWidth = 18;
  const bezelGrad = ctx.createLinearGradient(0, 0, size, size);
  bezelGrad.addColorStop(0, "#00f0ff");
  bezelGrad.addColorStop(0.3, "#0072ff");
  bezelGrad.addColorStop(0.7, "#9d4edd");
  bezelGrad.addColorStop(1, "#00f0ff");
  ctx.strokeStyle = bezelGrad;
  ctx.stroke();

  // 4. LED Neon Rivets
  const rivets = 24;
  for (let j = 0; j < rivets; j++) {
    const angle = (j * (Math.PI * 2)) / rivets + pinAngleOffset;
    const rx = cx + (radius + 2) * Math.cos(angle);
    const ry = cy + (radius + 2) * Math.sin(angle);

    ctx.beginPath();
    ctx.arc(rx, ry, 4.5, 0, Math.PI * 2);
    ctx.fillStyle = j % 2 === 0 ? "#00f0ff" : "#ffffff";
    ctx.shadowColor = "rgba(0, 240, 255, 0.9)";
    ctx.shadowBlur = 8;
    ctx.fill();
    ctx.shadowBlur = 0;
  }

  // 5. Center Hub
  ctx.beginPath();
  ctx.arc(cx, cy, 64, 0, Math.PI * 2);
  ctx.fillStyle = "#0c1427";
  ctx.fill();
  ctx.lineWidth = 6;
  ctx.strokeStyle = "rgba(0, 240, 255, 0.8)";
  ctx.stroke();

  ctx.beginPath();
  ctx.arc(cx, cy, 52, 0, Math.PI * 2);
  const hubGrad = ctx.createRadialGradient(cx - 15, cy - 15, 5, cx, cy, 52);
  hubGrad.addColorStop(0, "rgba(0, 240, 255, 0.35)");
  hubGrad.addColorStop(1, "rgba(12, 20, 39, 0.95)");
  ctx.fillStyle = hubGrad;
  ctx.fill();

  ctx.font = "30px sans-serif";
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.fillText("💧", cx, cy + 2);
}

// --- CONFETTI SYSTEM ---
let particles = [];
function fireConfetti(isGrand = false) {
  fxCanvas.width = window.innerWidth;
  fxCanvas.height = window.innerHeight;
  particles = [];
  const count = isGrand ? 160 : 100;
  const colors = ["#00f0ff", "#ff007f", "#05ffa1", "#ffbe0b", "#9d4edd", "#ffffff"];

  for (let i = 0; i < count; i++) {
    particles.push({
      x: window.innerWidth / 2,
      y: window.innerHeight / 2,
      vx: (Math.random() - 0.5) * (isGrand ? 30 : 22),
      vy: (Math.random() - 0.8) * (isGrand ? 32 : 24),
      size: Math.random() * 8 + 4,
      color: colors[Math.floor(Math.random() * colors.length)],
      alpha: 1,
      rot: Math.random() * 360,
      rotSpeed: (Math.random() - 0.5) * 14
    });
  }

  function render() {
    fxCtx.clearRect(0, 0, fxCanvas.width, fxCanvas.height);
    particles.forEach(p => {
      p.x += p.vx;
      p.y += p.vy;
      p.vy += 0.5;
      p.alpha -= isGrand ? 0.009 : 0.012;
      p.rot += p.rotSpeed;

      fxCtx.save();
      fxCtx.globalAlpha = Math.max(0, p.alpha);
      fxCtx.translate(p.x, p.y);
      fxCtx.rotate((p.rot * Math.PI) / 180);
      fxCtx.fillStyle = p.color;
      fxCtx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size);
      fxCtx.restore();
    });

    particles = particles.filter(p => p.alpha > 0);
    if (particles.length > 0) requestAnimationFrame(render);
  }
  requestAnimationFrame(render);
}

// --- LEADERBOARD & FLOATING PILLS ---
function renderLeaderboard(highlightWinner = null) {
  pointGrid.innerHTML = "";
  const maxScore = Math.max(...Object.values(scores), 1);

  roster.forEach(name => {
    const card = document.createElement("div");
    card.className = "player-point-card" + (name === highlightWinner ? " highlight" : "");
    card.id = `card-${name}`;

    const score = scores[name] || 0;
    const fillPercent = currentMode === 'series' ? (score / SERIES_MAX_SPINS) * 100 : (score / maxScore) * 100;

    card.innerHTML = `
      <div class="p-name">${name}</div>
      <div class="p-score">${score}</div>
      <div class="p-bar-bg">
        <div class="p-bar-fill" style="width: ${Math.min(fillPercent, 100)}%;"></div>
      </div>
    `;
    pointGrid.appendChild(card);
  });
}

function showFloatingPoint(victim) {
  const card = document.getElementById(`card-${victim}`);
  if (card) {
    const floater = document.createElement("div");
    floater.className = "point-float";
    floater.textContent = "+1 Pt 🎯";
    card.appendChild(floater);
    setTimeout(() => floater.remove(), 800);
  }
}

// --- SPIN ANIMATION PHYSICS ENGINE ---
function spinWheel() {
  if (isSpinning || roster.length < 2) return;
  ensureAudio();
  isSpinning = true;
  spinBtn.disabled = true;

  statusText.textContent = "Kismat ghoom rahi hai... 🌀";

  const winnerIndex = Math.floor(Math.random() * roster.length);
  const sliceSize = (Math.PI * 2) / roster.length;

  const targetAngle = -Math.PI / 2 - (winnerIndex + 0.5) * sliceSize;
  const currentNorm = rotation % (Math.PI * 2);
  const totalRounds = (8 + Math.floor(Math.random() * 3)) * Math.PI * 2;
  const delta = (targetAngle - currentNorm) + totalRounds + (targetAngle < currentNorm ? Math.PI * 2 : 0);

  const startRotation = rotation;
  const startTime = performance.now();
  const duration = 5200;

  function frame(now) {
    const elapsed = now - startTime;
    const progress = Math.min(elapsed / duration, 1);
    const easeOut = 1 - Math.pow(1 - progress, 4.6);
    rotation = startRotation + delta * easeOut;
    pinAngleOffset += 0.04 * (1 - progress * 0.8);

    drawWheel();

    const pointerAngle = (rotation + Math.PI / 2) % (Math.PI * 2);
    const positiveAngle = pointerAngle < 0 ? pointerAngle + Math.PI * 2 : pointerAngle;
    const currentSlice = Math.floor(positiveAngle / sliceSize);

    if (currentSlice !== lastSliceIndex && progress < 0.985) {
      lastSliceIndex = currentSlice;
      const speedFactor = 1 - progress;
      playHapticTick(460 + speedFactor * 320);
      pointerMech.classList.add("bump");
      setTimeout(() => pointerMech.classList.remove("bump"), 45);

      if (progress > 0.75) {
        statusText.textContent = `Lagta hai ${roster[currentSlice]} fasne wala hai... 👀`;
      }
    }

    if (progress < 1) {
      requestAnimationFrame(frame);
    } else {
      isSpinning = false;
      spinBtn.disabled = false;
      const victim = roster[winnerIndex];

      // Update Points
      scores[victim] = (scores[victim] || 0) + 1;
      renderLeaderboard(victim);
      showFloatingPoint(victim);

      // Camera Shake
      stage.classList.add("shake");
      setTimeout(() => stage.classList.remove("shake"), 450);

      if (currentMode === "instant") {
        statusText.textContent = "Bakra mil gaya! 🎯";
        playWinFanfare(false);
        fireConfetti(false);

        const shayari = instantShayaris[Math.floor(Math.random() * instantShayaris.length)];
        modalAvatar.textContent = "🐐";
        modalVictim.textContent = victim;
        modalBadge.textContent = "Official Jal Mantri";
        shayariLine1.textContent = shayari.l1;
        shayariLine2.textContent = shayari.l2;
        modalOverlay.classList.add("open");
      } else {
        currentSpinCount++;
        spinCounterPill.textContent = `${currentSpinCount} / ${SERIES_MAX_SPINS}`;

        if (currentSpinCount >= SERIES_MAX_SPINS) {
          let maxPts = -1;
          let losers = [];

          for (const [pName, pScore] of Object.entries(scores)) {
            if (pScore > maxPts) {
              maxPts = pScore;
              losers = [pName];
            } else if (pScore === maxPts) {
              losers.push(pName);
            }
          }

          const grandLoser = losers[Math.floor(Math.random() * losers.length)];
          statusText.textContent = "Tournament Khatam! Ultimate Champion mil gaya! 🏆";

          playWinFanfare(true);
          fireConfetti(true);

          const grandShayari = finaleShayaris[Math.floor(Math.random() * finaleShayaris.length)];
          modalAvatar.textContent = "👑";
          modalVictim.textContent = grandLoser;
          modalBadge.textContent = `10-Spins Winner (${maxPts} Points)`;
          shayariLine1.textContent = grandShayari.l1;
          shayariLine2.textContent = grandShayari.l2;
          modalOverlay.classList.add("open");

          currentSpinCount = 0;
        } else {
          statusText.textContent = `Round ${currentSpinCount} Complete! ${victim} got +1 Pt! Spin again!`;
          playWinFanfare(false);
        }
      }
    }
  }

  requestAnimationFrame(frame);
}

// --- TEAM MANAGEMENT ---
function renderTags() {
  tagsList.innerHTML = "";
  roster.forEach((name, index) => {
    const tag = document.createElement("div");
    tag.className = "tag";
    tag.innerHTML = `<span>${name}</span><span class="tag-remove" data-index="${index}">&times;</span>`;
    tagsList.appendChild(tag);
  });
  drawWheel();
  renderLeaderboard();
}

function addName() {
  const val = nameInput.value.trim();
  if (val && !roster.includes(val) && roster.length < 12) {
    roster.push(val);
    scores[val] = 0;
    nameInput.value = "";
    renderTags();
  }
}

tagsList.addEventListener("click", (e) => {
  if (e.target.classList.contains("tag-remove")) {
    if (roster.length <= 2) {
      alert("Kam se kam 2 log hone chahiye duty ke liye!");
      return;
    }
    const idx = parseInt(e.target.dataset.index, 10);
    const removed = roster[idx];
    roster.splice(idx, 1);
    delete scores[removed];
    renderTags();
  }
});

addBtn.addEventListener("click", addName);
nameInput.addEventListener("keydown", (e) => { if (e.key === "Enter") addName(); });
spinBtn.addEventListener("click", spinWheel);

closeModalBtn.addEventListener("click", () => {
  modalOverlay.classList.remove("open");
});

copyBtn.addEventListener("click", () => {
  const text = `🚨 *WATER DUTY SHAYARI* 🚨\nTarget: ${modalVictim.textContent}\nStatus: ${modalBadge.textContent}\n\n"${shayariLine1.textContent}\n${shayariLine2.textContent}"`;
  navigator.clipboard.writeText(text).then(() => {
    copyBtn.textContent = "Copied! 😂";
    setTimeout(() => { copyBtn.textContent = "Copy Shayari 📋"; }, 2000);
  });
});

// Mode Switching
tabInstant.addEventListener("click", () => {
  if (isSpinning) return;
  currentMode = "instant";
  tabInstant.classList.add("active");
  tabSeries.classList.remove("active");
  seriesHud.style.display = "none";
  document.getElementById("boardTitle").textContent = "Live Scoreboard";
});

tabSeries.addEventListener("click", () => {
  if (isSpinning) return;
  currentMode = "series";
  tabSeries.classList.add("active");
  tabInstant.classList.remove("active");
  seriesHud.style.display = "flex";
  document.getElementById("boardTitle").textContent = "10-Spins Match Leaderboard";
  resetSeries();
});

function resetSeries() {
  currentSpinCount = 0;
  spinCounterPill.textContent = `0 / ${SERIES_MAX_SPINS}`;
  roster.forEach(n => scores[n] = 0);
  renderLeaderboard();
  statusText.textContent = "Match Reset! Spin karo!";
}

resetSeriesBtn.addEventListener("click", resetSeries);

window.addEventListener("resize", () => {
  fxCanvas.width = window.innerWidth;
  fxCanvas.height = window.innerHeight;
});

// Init
setupCanvasDPI();
renderTags();
</script>
