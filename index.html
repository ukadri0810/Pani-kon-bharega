<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Royal Hydration Roulette - Luxury Edition</title>
<style>
  :root {
    --bg-main: #06080e;
    --gold-primary: #e5b869;
    --gold-bright: #ffd98a;
    --gold-dark: #8a6524;
    --gold-gradient: linear-gradient(135deg, #ffd98a 0%, #d4a04e 50%, #916828 100%);
    --surface-glass: rgba(16, 21, 33, 0.72);
    --surface-border: rgba(229, 184, 105, 0.22);
    --text-pure: #ffffff;
    --text-muted: #9ba3b5;
    --accent-red: #ff3366;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
    background: radial-gradient(circle at 50% 15%, #182035 0%, #080b13 60%, var(--bg-main) 100%);
    color: var(--text-pure);
    padding: 20px 14px;
    overflow-x: hidden;
  }

  .stage {
    width: min(100%, 540px);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
    position: relative;
    z-index: 2;
  }

  /* Header */
  .brand-badge {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    padding: 5px 16px;
    border-radius: 99px;
    background: rgba(229, 184, 105, 0.08);
    border: 1px solid var(--surface-border);
    font-size: 11px;
    font-weight: 800;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--gold-bright);
    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
  }

  h1 {
    margin: 0;
    font-size: clamp(26px, 6vw, 36px);
    font-weight: 900;
    letter-spacing: -0.5px;
    background: linear-gradient(135deg, #ffffff 30%, #ffd98a 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    text-align: center;
  }

  /* Mode Switcher */
  .mode-switch-wrap {
    display: flex;
    background: rgba(8, 12, 20, 0.85);
    border: 1px solid var(--surface-border);
    padding: 4px;
    border-radius: 14px;
    width: 100%;
    max-width: 400px;
    gap: 4px;
    backdrop-filter: blur(12px);
  }

  .mode-tab {
    flex: 1;
    border: none;
    background: transparent;
    color: var(--text-muted);
    padding: 9px 12px;
    border-radius: 10px;
    font-size: 12px;
    font-weight: 800;
    letter-spacing: 0.5px;
    cursor: pointer;
    transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  .mode-tab.active {
    background: var(--gold-gradient);
    color: #0d1117;
    box-shadow: 0 4px 14px rgba(229, 184, 105, 0.3);
  }

  /* Series HUD */
  .series-hud {
    width: 100%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: var(--surface-glass);
    border: 1px solid var(--surface-border);
    padding: 10px 16px;
    border-radius: 12px;
    font-size: 12px;
    font-weight: 700;
  }

  .series-pill {
    background: rgba(229, 184, 105, 0.15);
    color: var(--gold-bright);
    border: 1px solid var(--surface-border);
    padding: 3px 10px;
    border-radius: 20px;
  }

  .btn-reset {
    background: transparent;
    border: 1px solid rgba(255, 255, 255, 0.15);
    color: var(--text-muted);
    padding: 4px 10px;
    border-radius: 8px;
    font-size: 11px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.2s;
  }
  .btn-reset:hover { color: #fff; border-color: var(--gold-bright); }

  /* Roster Bar */
  .roster-card {
    width: 100%;
    background: var(--surface-glass);
    border: 1px solid var(--surface-border);
    backdrop-filter: blur(16px);
    border-radius: 14px;
    padding: 10px 12px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .roster-input-row {
    display: flex;
    gap: 8px;
  }

  .roster-input {
    flex: 1;
    background: rgba(0, 0, 0, 0.4);
    border: 1px solid var(--surface-border);
    border-radius: 10px;
    padding: 8px 14px;
    font-size: 13px;
    color: #fff;
    outline: none;
    transition: border-color 0.2s;
  }

  .roster-input:focus { border-color: var(--gold-primary); }

  .add-btn {
    background: var(--gold-gradient);
    border: none;
    color: #0a0e17;
    border-radius: 10px;
    padding: 0 16px;
    font-weight: 900;
    font-size: 13px;
    cursor: pointer;
    transition: transform 0.2s;
  }
  .add-btn:active { transform: scale(0.96); }

  .tags-list {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    max-height: 52px;
    overflow-y: auto;
  }

  .tag {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: rgba(229, 184, 105, 0.08);
    border: 1px solid var(--surface-border);
    padding: 3px 9px;
    border-radius: 20px;
    font-size: 11px;
    font-weight: 700;
    color: #e2e8f0;
  }

  .tag-remove {
    cursor: pointer;
    opacity: 0.5;
    transition: opacity 0.15s;
  }
  .tag-remove:hover { opacity: 1; color: var(--accent-red); }

  /* Wheel Frame */
  .wheel-viewport {
    position: relative;
    width: min(84vw, 385px);
    aspect-ratio: 1;
    margin: 4px 0;
  }

  .halo-ring {
    position: absolute;
    inset: -14px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(229, 184, 105, 0.2) 0%, transparent 72%);
    filter: blur(10px);
    z-index: 1;
    pointer-events: none;
  }

  canvas#wheelCanvas {
    position: relative;
    z-index: 2;
    width: 100%;
    height: 100%;
    filter: drop-shadow(0 25px 45px rgba(0, 0, 0, 0.85));
  }

  /* Precision Indicator */
  .pointer-mech {
    position: absolute;
    top: -10px;
    left: 50%;
    transform: translateX(-50%);
    width: 32px;
    height: 48px;
    z-index: 10;
    pointer-events: none;
    transform-origin: 50% 10px;
    filter: drop-shadow(0 8px 12px rgba(0,0,0,0.8));
    transition: transform 0.05s ease-out;
  }

  .pointer-mech.bump {
    transform: translateX(-50%) rotate(-24deg) scale(1.12);
  }

  /* Spin Button */
  .action-wrap {
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
  }

  .spin-master-btn {
    position: relative;
    width: 100%;
    max-width: 350px;
    padding: 16px 24px;
    border: none;
    border-radius: 16px;
    background: var(--gold-gradient);
    color: #090c14;
    font-size: 17px;
    font-weight: 900;
    letter-spacing: 1px;
    text-transform: uppercase;
    cursor: pointer;
    box-shadow: 0 10px 30px rgba(229, 184, 105, 0.35), inset 0 2px 2px rgba(255, 255, 255, 0.6);
    transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
    overflow: hidden;
  }

  .spin-master-btn::after {
    content: '';
    position: absolute;
    top: 0; left: -100%; width: 50%; height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.6), transparent);
    transform: skewX(-20deg);
    animation: shineSweep 3.5s infinite;
  }

  @keyframes shineSweep {
    18%, 100% { left: 160%; }
  }

  .spin-master-btn:hover:not(:disabled) {
    transform: translateY(-2px) scale(1.02);
    box-shadow: 0 14px 40px rgba(229, 184, 105, 0.55);
  }

  .spin-master-btn:active:not(:disabled) {
    transform: translateY(2px) scale(0.98);
  }

  .spin-master-btn:disabled {
    filter: grayscale(0.8);
    opacity: 0.5;
    cursor: not-allowed;
  }

  .suspense-status {
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.8px;
    color: var(--text-muted);
    min-height: 16px;
  }

  /* Points Leaderboard Grid */
  .points-board {
    width: 100%;
    background: var(--surface-glass);
    border: 1px solid var(--surface-border);
    backdrop-filter: blur(16px);
    border-radius: 16px;
    padding: 12px 14px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .board-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 11px;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 1.2px;
    color: var(--gold-bright);
  }

  .player-point-list {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(110px, 1fr));
    gap: 8px;
  }

  .player-point-card {
    position: relative;
    background: rgba(0, 0, 0, 0.35);
    border: 1px solid rgba(255, 255, 255, 0.06);
    border-radius: 12px;
    padding: 10px 8px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
    transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  .player-point-card.highlight {
    border-color: var(--gold-primary);
    transform: scale(1.04);
    box-shadow: 0 0 20px rgba(229, 184, 105, 0.3);
  }

  .p-name {
    font-size: 12px;
    font-weight: 800;
    color: #fff;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 100%;
  }

  .p-score {
    font-size: 22px;
    font-weight: 900;
    color: var(--gold-bright);
    line-height: 1;
  }

  .p-bar-bg {
    width: 100%;
    height: 4px;
    background: rgba(255, 255, 255, 0.08);
    border-radius: 4px;
    overflow: hidden;
    margin-top: 3px;
  }

  .p-bar-fill {
    height: 100%;
    background: var(--gold-gradient);
    width: 0%;
    transition: width 0.4s ease;
  }

  .point-float {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    color: var(--gold-bright);
    font-weight: 900;
    font-size: 17px;
    pointer-events: none;
    animation: floatUp 0.8s forwards cubic-bezier(0.16, 1, 0.3, 1);
    text-shadow: 0 0 10px rgba(229, 184, 105, 0.8);
  }

  @keyframes floatUp {
    0% { transform: translate(-50%, 0) scale(0.5); opacity: 0; }
    30% { transform: translate(-50%, -15px) scale(1.3); opacity: 1; }
    100% { transform: translate(-50%, -35px) scale(1); opacity: 0; }
  }

  /* Shayari Reveal Modal */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(4, 6, 11, 0.88);
    backdrop-filter: blur(14px);
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.35s cubic-bezier(0.16, 1, 0.3, 1);
  }

  .modal-overlay.open {
    opacity: 1;
    pointer-events: auto;
  }

  .shayari-card {
    width: min(100%, 460px);
    background: radial-gradient(circle at 50% 0%, #1c263c 0%, #0d121c 100%);
    border: 1px solid var(--surface-border);
    border-radius: 24px;
    padding: 28px 22px;
    text-align: center;
    box-shadow: 0 30px 70px rgba(0, 0, 0, 0.9), 0 0 45px rgba(229, 184, 105, 0.18);
    transform: scale(0.85) translateY(25px);
    transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  .modal-overlay.open .shayari-card {
    transform: scale(1) translateY(0);
  }

  .victim-avatar {
    width: 60px;
    height: 60px;
    margin: 0 auto 10px;
    border-radius: 50%;
    background: var(--gold-gradient);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 30px;
    box-shadow: 0 0 25px rgba(229, 184, 105, 0.45);
  }

  .victim-name {
    font-size: 28px;
    font-weight: 900;
    letter-spacing: -0.5px;
    color: #fff;
    margin: 0 0 2px;
  }

  .victim-badge {
    display: inline-block;
    padding: 4px 14px;
    border-radius: 50px;
    background: rgba(229, 184, 105, 0.12);
    border: 1px solid var(--surface-border);
    color: var(--gold-bright);
    font-size: 11px;
    font-weight: 800;
    letter-spacing: 1px;
    text-transform: uppercase;
    margin-bottom: 16px;
  }

  .shayari-box {
    background: rgba(0, 0, 0, 0.35);
    padding: 18px;
    border-radius: 16px;
    border: 1px solid rgba(229, 184, 105, 0.15);
    margin-bottom: 22px;
    position: relative;
  }

  .shayari-box::before {
    content: '“';
    position: absolute;
    top: -12px;
    left: 14px;
    font-size: 42px;
    color: var(--gold-primary);
    font-family: Georgia, serif;
    opacity: 0.4;
  }

  .shayari-line1 {
    font-size: 15px;
    font-weight: 700;
    color: #f1f5f9;
    line-height: 1.5;
    margin-bottom: 6px;
  }

  .shayari-line2 {
    font-size: 15px;
    font-weight: 800;
    color: var(--gold-bright);
    line-height: 1.5;
  }

  .modal-btn-row {
    display: flex;
    gap: 10px;
  }

  .btn-modal {
    flex: 1;
    padding: 13px;
    border-radius: 12px;
    font-size: 13px;
    font-weight: 800;
    cursor: pointer;
    border: none;
    transition: transform 0.15s;
  }

  .btn-modal:active { transform: scale(0.96); }

  .btn-close {
    background: var(--gold-gradient);
    color: #0a0e17;
  }

  .btn-copy {
    background: rgba(255, 255, 255, 0.08);
    color: #fff;
    border: 1px solid rgba(255, 255, 255, 0.15);
  }

  canvas#fxCanvas {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 105;
  }

  .shake {
    animation: camShake 0.45s cubic-bezier(0.36, 0.07, 0.19, 0.97) both;
  }

  @keyframes camShake {
    10%, 90% { transform: translate3d(-2px, 0, 0); }
    20%, 80% { transform: translate3d(3px, 0, 0); }
    30%, 50%, 70% { transform: translate3d(-5px, 0, 0); }
    40%, 60% { transform: translate3d(5px, 0, 0); }
  }
</style>
</head>
<body>

<canvas id="fxCanvas"></canvas>

<div class="stage" id="stage">
  <div class="brand-badge">👑 Royal Hydration Protocol</div>
  <h1>Wheel of Bakra</h1>

  <!-- Mode Switcher -->
  <div class="mode-switch-wrap">
    <button class="mode-tab active" id="tabInstant">⚡ Single Spin (Instant)</button>
    <button class="mode-tab" id="tabSeries">🎯 10-Spins Battle</button>
  </div>

  <!-- Series Progress -->
  <div class="series-hud" id="seriesHud" style="display: none;">
    <div>Match Round: <span class="series-pill" id="spinCounterPill">0 / 10</span></div>
    <div style="font-size: 11px; color: var(--text-muted);">Max points = Ultimate Bakra!</div>
    <button class="btn-reset" id="resetSeriesBtn">↺ Reset</button>
  </div>

  <!-- Roster Control -->
  <div class="roster-card">
    <div class="roster-input-row">
      <input type="text" id="nameInput" class="roster-input" placeholder="Type name & hit Enter..." maxlength="14">
      <button class="add-btn" id="addBtn">+ Add</button>
    </div>
    <div class="tags-list" id="tagsList"></div>
  </div>

  <!-- Luxury Canvas Wheel -->
  <div class="wheel-viewport">
    <div class="halo-ring"></div>
    <div class="pointer-mech" id="pointerMech">
      <svg viewBox="0 0 32 48" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M16 48L3 14C1 8 5 0 11 0H21C27 0 31 8 29 14L16 48Z" fill="url(#ptrGold)"/>
        <circle cx="16" cy="14" r="5" fill="#ffffff" filter="drop-shadow(0 0 4px #ffd98a)"/>
        <defs>
          <linearGradient id="ptrGold" x1="16" y1="0" x2="16" y2="48" gradientUnits="userSpaceOnUse">
            <stop stop-color="#FFF0B3"/>
            <stop offset="0.4" stop-color="#E5B869"/>
            <stop offset="1" stop-color="#8A6524"/>
          </linearGradient>
        </defs>
      </svg>
    </div>
    <canvas id="wheelCanvas" width="800" height="800"></canvas>
  </div>

  <!-- Spin Controls -->
  <div class="action-wrap">
    <button class="spin-master-btn" id="spinBtn">SPIN THE WHEEL 🎲</button>
    <div class="suspense-status" id="suspenseText">Kiski kismat phootne wali hai?</div>
  </div>

  <!-- Leaderboard -->
  <div class="points-board">
    <div class="board-header">
      <span id="boardTitle">Live Score Counter</span>
      <span style="font-size: 10px; color: var(--gold-bright);">+1 Pt per spin hit</span>
    </div>
    <div class="player-point-list" id="pointGrid"></div>
  </div>
</div>

<!-- Rhyme / Shayari Modal -->
<div class="modal-overlay" id="modalOverlay">
  <div class="shayari-card">
    <div class="victim-avatar" id="modalAvatar">🐐</div>
    <h2 class="victim-name" id="modalVictim">Rohan</h2>
    <div class="victim-badge" id="modalBadge">Designated Jal Mantri</div>
    
    <div class="shayari-box">
      <div class="shayari-line1" id="shayariLine1">Subah se baithe baithe tod raha hai khatiya,</div>
      <div class="shayari-line2" id="shayariLine2">Chal uth botal bhar, acting mat kar ghatiya! 🚰🔥</div>
    </div>

    <div class="modal-btn-row">
      <button class="btn-modal btn-copy" id="copyBtn">Shayari Copy Karo 📋</button>
      <button class="btn-modal btn-close" id="closeModalBtn">Main Jaata Hu 🏃‍♂️</button>
    </div>
  </div>
</div>

<script>
// --- ROSTER & LUXURY COLOR PALETTE ---
let roster = ["Pranay", "Rohan", "Vivek", "Gaus"];
let scores = { "Pranay": 0, "Rohan": 0, "Vivek": 0, "Gaus": 0 };

// Ultra-premium jewel-tone gradients
const LUXE_PALETTES = [
  { primary: "#6d28d9", secondary: "#3b0764", accent: "#c084fc" }, // Royal Amethyst
  { primary: "#0891b2", secondary: "#164e63", accent: "#67e8f9" }, // Sapphire Ocean
  { primary: "#be123c", secondary: "#4c0519", accent: "#fda4af" }, // Imperial Ruby
  { primary: "#b45309", secondary: "#451a03", accent: "#fde68a" }, // Molten Amber
  { primary: "#047857", secondary: "#022c22", accent: "#6ee7b7" }, // Emerald Velvet
  { primary: "#4338ca", secondary: "#1e1b4b", accent: "#a5b4fc" }, // Deep Indigo
  { primary: "#9d174d", secondary: "#500724", accent: "#f472b6" }  // Rich Rose
];

// --- HINGLISH SHAYARI / RHYMING ROASTS ---
const instantShayaris = [
  {
    l1: "Subah se baithe baithe tod raha tha khatiya,",
    l2: "Chal uth botal bhar, acting mat kar ghatiya! 🚰🔥"
  },
  {
    l1: "Slack pe busy hone ka natak band kar pyaare,",
    l2: "Purifier bula raha hai khol ke baahein saare! 🏃‍♂️💨"
  },
  {
    l1: "Code me tere chahe kitne bhi ho error,",
    l2: "Paani lane me nahi chalega tera terror! 💻💧"
  },
  {
    l1: "Chair se chipak ke ban gaya tha aalsi nawab,",
    l2: "Botal bhar ke la warna junta maangegi hisaab! 🪑👑"
  },
  {
    l1: "Screen ko ghoor ke mat ban itna serious bro,",
    l2: "Filter ki taraf thoda step badha ke go! 🚶‍♂️✨"
  },
  {
    l1: "Meeting ka bahana ab kaam nahi aayega,",
    l2: "Paani laaye bina tu lunch nahi khaayega! 🍱🚫"
  },
  {
    l1: "Tu soch raha tha ki kismat degi sahara,",
    l2: "Par wheel ne tujhe hi 'Jal Mantri' pukara! 🏆🌊"
  },
  {
    l1: "Jitni speed se keyboard pe chalti hai ungli,",
    l2: "Utni speed se botal bhar ke laa jungli! ⌨️⚡"
  },
  {
    l1: "Aankhon me umeed aur dil me tha darr,",
    l2: "Ab chup chaap jaa aur thanda paani bhar! 🧊🙌"
  },
  {
    l1: "Aasman me chamakte hain sitare tare,",
    l2: "Aaj botal bharenge hamare hero pyaare! 🌟🚰"
  }
];

const finaleShayaris = [
  {
    l1: "10 rounds ke mahayudh me kismat ne kiya aisa sitam,",
    l2: "Points table pe top karke botal ke malik ban gaye tum! 👑🚰"
  },
  {
    l1: "Duniya jeetne nikle the par paani me doob gayi naav,",
    l2: "Sabse zyada score karke bano tumhi office ke rao! 🐐🔥"
  },
  {
    l1: "Khel me sabne chalayi thi apni poori chaal,",
    l2: "Par points jeet ke bakre ka hua bura haal! 💀💧"
  }
];

// --- GAME MODE STATE ---
let currentMode = "instant";
const SERIES_MAX_SPINS = 10;
let currentSpinCount = 0;

// --- DOM ELEMENTS ---
const canvas = document.getElementById("wheelCanvas");
const ctx = canvas.getContext("2d");
const fxCanvas = document.getElementById("fxCanvas");
const fxCtx = fxCanvas.getContext("2d");
const pointerMech = document.getElementById("pointerMech");
const spinBtn = document.getElementById("spinBtn");
const suspenseText = document.getElementById("suspenseText");
const modalOverlay = document.getElementById("modalOverlay");
const modalVictim = document.getElementById("modalVictim");
const modalBadge = document.getElementById("modalBadge");
const modalAvatar = document.getElementById("modalAvatar");
const shayariLine1 = document.getElementById("shayariLine1");
const shayariLine2 = document.getElementById("shayariLine2");
const closeModalBtn = document.getElementById("closeModalBtn");
const copyBtn = document.getElementById("copyBtn");
const nameInput = document.getElementById("nameInput");
const addBtn = document.getElementById("addBtn");
const tagsList = document.getElementById("tagsList");
const pointGrid = document.getElementById("pointGrid");
const stage = document.getElementById("stage");
const tabInstant = document.getElementById("tabInstant");
const tabSeries = document.getElementById("tabSeries");
const seriesHud = document.getElementById("seriesHud");
const spinCounterPill = document.getElementById("spinCounterPill");
const resetSeriesBtn = document.getElementById("resetSeriesBtn");

// --- SYNTHETIC AUDIO ENGINE ---
let audioCtx = null;

function ensureAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
}

function playHapticTick(pitch = 560) {
  if (!audioCtx) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  
  osc.type = "sine";
  osc.frequency.setValueAtTime(pitch, audioCtx.currentTime);
  osc.frequency.exponentialRampToValueAtTime(70, audioCtx.currentTime + 0.035);

  gain.gain.setValueAtTime(0.22, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.035);

  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start();
  osc.stop(audioCtx.currentTime + 0.035);
}

function playWinStinger(isGrand = false) {
  if (!audioCtx) return;
  const freqs = isGrand ? [261.63, 329.63, 392.00, 523.25, 659.25, 783.99] : [329.63, 415.30, 493.88, 659.25];
  freqs.forEach((freq, i) => {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = isGrand ? "sawtooth" : "triangle";
    osc.frequency.value = freq;
    
    const start = audioCtx.currentTime + i * 0.07;
    gain.gain.setValueAtTime(0.22, start);
    gain.gain.exponentialRampToValueAtTime(0.001, start + (isGrand ? 0.8 : 0.45));

    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start(start);
    osc.stop(start + (isGrand ? 0.8 : 0.45));
  });
}

// --- CANVAS HIGH DPI RENDERING ---
let rotation = 0;
let isSpinning = false;
let lastSliceIndex = -1;
let pinAngleOffset = 0;

function setupCanvasDPI() {
  const dpr = window.devicePixelRatio || 1;
  canvas.width = 800 * dpr;
  canvas.height = 800 * dpr;
  ctx.scale(dpr, dpr);
}

function drawWheel() {
  const size = 800;
  const cx = size / 2;
  const cy = size / 2;
  const radius = 340;
  const numSlices = roster.length;
  const slice = (Math.PI * 2) / numSlices;

  ctx.clearRect(0, 0, size, size);

  // 1. Deep Obsidian Base
  ctx.beginPath();
  ctx.arc(cx, cy, radius + 16, 0, Math.PI * 2);
  ctx.fillStyle = "#090d16";
  ctx.fill();

  // 2. Jewel-Tone Wheel Slices
  for (let i = 0; i < numSlices; i++) {
    const startAngle = rotation + i * slice;
    const endAngle = startAngle + slice;
    const palette = LUXE_PALETTES[i % LUXE_PALETTES.length];

    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.arc(cx, cy, radius, startAngle, endAngle);
    ctx.closePath();

    // Radial Jewel Gradient
    const grad = ctx.createRadialGradient(cx, cy, 30, cx, cy, radius);
    grad.addColorStop(0, palette.primary);
    grad.addColorStop(0.7, palette.secondary);
    grad.addColorStop(1, "#080c14");
    ctx.fillStyle = grad;
    ctx.fill();

    // Golden Sector Inlay Lines
    ctx.strokeStyle = "rgba(229, 184, 105, 0.35)";
    ctx.lineWidth = 3;
    ctx.stroke();

    // Slice Typography
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(startAngle + slice / 2);
    ctx.textAlign = "right";
    ctx.textBaseline = "middle";
    
    ctx.fillStyle = "#ffffff";
    ctx.font = "900 34px -apple-system, sans-serif";
    ctx.shadowColor = "rgba(0,0,0,0.8)";
    ctx.shadowBlur = 10;
    ctx.fillText(roster[i], radius - 55, 0);

    // Subtle Gold Accent Pip
    ctx.beginPath();
    ctx.arc(radius - 22, 0, 4, 0, Math.PI * 2);
    ctx.fillStyle = palette.accent;
    ctx.fill();
    ctx.restore();
  }

  // 3. Precision Machined Metallic Bezel
  ctx.beginPath();
  ctx.arc(cx, cy, radius + 2, 0, Math.PI * 2);
  ctx.lineWidth = 18;
  const bezelGrad = ctx.createLinearGradient(0, 0, size, size);
  bezelGrad.addColorStop(0, "#ffd98a");
  bezelGrad.addColorStop(0.3, "#8a6524");
  bezelGrad.addColorStop(0.7, "#e5b869");
  bezelGrad.addColorStop(1, "#4a3512");
  ctx.strokeStyle = bezelGrad;
  ctx.stroke();

  // 4. Gold Studs / Rivets
  const rivets = 24;
  for (let j = 0; j < rivets; j++) {
    const angle = (j * (Math.PI * 2)) / rivets + pinAngleOffset;
    const rx = cx + (radius + 2) * Math.cos(angle);
    const ry = cy + (radius + 2) * Math.sin(angle);

    ctx.beginPath();
    ctx.arc(rx, ry, 4.5, 0, Math.PI * 2);
    ctx.fillStyle = j % 2 === 0 ? "#fff0b3" : "#ffd98a";
    ctx.shadowColor = "rgba(255, 217, 138, 0.8)";
    ctx.shadowBlur = 8;
    ctx.fill();
    ctx.shadowBlur = 0;
  }

  // 5. Deluxe Center Hub
  ctx.beginPath();
  ctx.arc(cx, cy, 64, 0, Math.PI * 2);
  ctx.fillStyle = "#080b12";
  ctx.fill();
  ctx.lineWidth = 6;
  ctx.strokeStyle = "rgba(229, 184, 105, 0.8)";
  ctx.stroke();

  ctx.beginPath();
  ctx.arc(cx, cy, 52, 0, Math.PI * 2);
  const hubGrad = ctx.createRadialGradient(cx - 15, cy - 15, 5, cx, cy, 52);
  hubGrad.addColorStop(0, "rgba(255, 217, 138, 0.4)");
  hubGrad.addColorStop(1, "rgba(10, 14, 24, 0.95)");
  ctx.fillStyle = hubGrad;
  ctx.fill();

  ctx.font = "30px sans-serif";
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.fillText("💧", cx, cy + 2);
}

// --- PARTICLE CELEBRATION SYSTEM ---
let particles = [];
function fireConfetti(isGrand = false) {
  fxCanvas.width = window.innerWidth;
  fxCanvas.height = window.innerHeight;
  particles = [];
  const count = isGrand ? 160 : 100;
  const colors = ["#ffd98a", "#e5b869", "#ffffff", "#00f2fe", "#ff3366", "#c084fc"];

  for (let i = 0; i < count; i++) {
    particles.push({
      x: window.innerWidth / 2,
      y: window.innerHeight / 2,
      vx: (Math.random() - 0.5) * (isGrand ? 30 : 22),
      vy: (Math.random() - 0.8) * (isGrand ? 32 : 24),
      size: Math.random() * 8 + 4,
      color: colors[Math.floor(Math.random() * colors.length)],
      alpha: 1,
      rot: Math.random() * 360,
      rotSpeed: (Math.random() - 0.5) * 14
    });
  }

  function render() {
    fxCtx.clearRect(0, 0, fxCanvas.width, fxCanvas.height);
    particles.forEach(p => {
      p.x += p.vx;
      p.y += p.vy;
      p.vy += 0.5;
      p.alpha -= isGrand ? 0.009 : 0.012;
      p.rot += p.rotSpeed;

      fxCtx.save();
      fxCtx.globalAlpha = Math.max(0, p.alpha);
      fxCtx.translate(p.x, p.y);
      fxCtx.rotate((p.rot * Math.PI) / 180);
      fxCtx.fillStyle = p.color;
      fxCtx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size);
      fxCtx.restore();
    });

    particles = particles.filter(p => p.alpha > 0);
    if (particles.length > 0) requestAnimationFrame(render);
  }
  requestAnimationFrame(render);
}

// --- LEADERBOARD LOGIC ---
function renderLeaderboard(highlightWinner = null) {
  pointGrid.innerHTML = "";
  const maxScore = Math.max(...Object.values(scores), 1);

  roster.forEach(name => {
    const card = document.createElement("div");
    card.className = "player-point-card" + (name === highlightWinner ? " highlight" : "");
    card.id = `card-${name}`;

    const score = scores[name] || 0;
    const fillPercent = currentMode === 'series' ? (score / SERIES_MAX_SPINS) * 100 : (score / maxScore) * 100;

    card.innerHTML = `
      <div class="p-name">${name}</div>
      <div class="p-score">${score}</div>
      <div class="p-bar-bg">
        <div class="p-bar-fill" style="width: ${Math.min(fillPercent, 100)}%;"></div>
      </div>
    `;
    pointGrid.appendChild(card);
  });
}

function showFloatingPoint(victim) {
  const card = document.getElementById(`card-${victim}`);
  if (card) {
    const floater = document.createElement("div");
    floater.className = "point-float";
    floater.textContent = "+1 Pt 🎯";
    card.appendChild(floater);
    setTimeout(() => floater.remove(), 800);
  }
}

// --- PHYSICS SPIN ENGINE ---
function spinWheel() {
  if (isSpinning || roster.length < 2) return;
  ensureAudio();
  isSpinning = true;
  spinBtn.disabled = true;

  suspenseText.textContent = "Kismat ghoom rahi hai... 🌀";

  const winnerIndex = Math.floor(Math.random() * roster.length);
  const sliceSize = (Math.PI * 2) / roster.length;

  const targetAngle = -Math.PI / 2 - (winnerIndex + 0.5) * sliceSize;
  const currentNorm = rotation % (Math.PI * 2);
  const totalRounds = (8 + Math.floor(Math.random() * 3)) * Math.PI * 2;
  const delta = (targetAngle - currentNorm) + totalRounds + (targetAngle < currentNorm ? Math.PI * 2 : 0);

  const startRotation = rotation;
  const startTime = performance.now();
  const duration = 5200;

  function frame(now) {
    const elapsed = now - startTime;
    const progress = Math.min(elapsed / duration, 1);
    const easeOut = 1 - Math.pow(1 - progress, 4.6);
    rotation = startRotation + delta * easeOut;
    pinAngleOffset += 0.04 * (1 - progress * 0.8);

    drawWheel();

    const pointerAngle = (rotation + Math.PI / 2) % (Math.PI * 2);
    const positiveAngle = pointerAngle < 0 ? pointerAngle + Math.PI * 2 : pointerAngle;
    const currentSlice = Math.floor(positiveAngle / sliceSize);

    if (currentSlice !== lastSliceIndex && progress < 0.985) {
      lastSliceIndex = currentSlice;
      const speedFactor = 1 - progress;
      playHapticTick(460 + speedFactor * 320);
      pointerMech.classList.add("bump");
      setTimeout(() => pointerMech.classList.remove("bump"), 45);

      if (progress > 0.75) {
        suspenseText.textContent = `Lagta hai ${roster[currentSlice]} fasne wala hai... 👀`;
      }
    }

    if (progress < 1) {
      requestAnimationFrame(frame);
    } else {
      isSpinning = false;
      spinBtn.disabled = false;
      const victim = roster[winnerIndex];

      // Update Points
      scores[victim] = (scores[victim] || 0) + 1;
      renderLeaderboard(victim);
      showFloatingPoint(victim);

      // Camera Shake
      stage.classList.add("shake");
      setTimeout(() => stage.classList.remove("shake"), 450);

      if (currentMode === "instant") {
        suspenseText.textContent = "Bakra mil gaya! 🎯";
        playWinStinger(false);
        fireConfetti(false);

        const shayari = instantShayaris[Math.floor(Math.random() * instantShayaris.length)];
        modalAvatar.textContent = "🐐";
        modalVictim.textContent = victim;
        modalBadge.textContent = "Designated Jal Mantri";
        shayariLine1.textContent = shayari.l1;
        shayariLine2.textContent = shayari.l2;
        modalOverlay.classList.add("open");
      } else {
        currentSpinCount++;
        spinCounterPill.textContent = `${currentSpinCount} / ${SERIES_MAX_SPINS}`;

        if (currentSpinCount >= SERIES_MAX_SPINS) {
          // Identify Highest Point Holder
          let maxPts = -1;
          let losers = [];

          for (const [pName, pScore] of Object.entries(scores)) {
            if (pScore > maxPts) {
              maxPts = pScore;
              losers = [pName];
            } else if (pScore === maxPts) {
              losers.push(pName);
            }
          }

          const grandLoser = losers[Math.floor(Math.random() * losers.length)];
          suspenseText.textContent = "Tournament Khatam! Ultimate Bakra mil gaya! 🏆";

          playWinStinger(true);
          fireConfetti(true);

          const grandShayari = finaleShayaris[Math.floor(Math.random() * finaleShayaris.length)];
          modalAvatar.textContent = "👑";
          modalVictim.textContent = grandLoser;
          modalBadge.textContent = `Tournament Champion Bakra (${maxPts} Points)`;
          shayariLine1.textContent = grandShayari.l1;
          shayariLine2.textContent = grandShayari.l2;
          modalOverlay.classList.add("open");

          currentSpinCount = 0;
        } else {
          suspenseText.textContent = `Round ${currentSpinCount} Done! ${victim} got +1 Pt! Spin again!`;
          playWinStinger(false);
        }
      }
    }
  }

  requestAnimationFrame(frame);
}

// --- ROSTER MANAGEMENT UI ---
function renderTags() {
  tagsList.innerHTML = "";
  roster.forEach((name, index) => {
    const tag = document.createElement("div");
    tag.className = "tag";
    tag.innerHTML = `<span>${name}</span><span class="tag-remove" data-index="${index}">&times;</span>`;
    tagsList.appendChild(tag);
  });
  drawWheel();
  renderLeaderboard();
}

function addName() {
  const val = nameInput.value.trim();
  if (val && !roster.includes(val) && roster.length < 12) {
    roster.push(val);
    scores[val] = 0;
    nameInput.value = "";
    renderTags();
  }
}

tagsList.addEventListener("click", (e) => {
  if (e.target.classList.contains("tag-remove")) {
    if (roster.length <= 2) {
      alert("Kam se kam 2 log toh hone chahiye duty ke liye!");
      return;
    }
    const idx = parseInt(e.target.dataset.index, 10);
    const removed = roster[idx];
    roster.splice(idx, 1);
    delete scores[removed];
    renderTags();
  }
});

addBtn.addEventListener("click", addName);
nameInput.addEventListener("keydown", (e) => { if (e.key === "Enter") addName(); });
spinBtn.addEventListener("click", spinWheel);

closeModalBtn.addEventListener("click", () => {
  modalOverlay.classList.remove("open");
});

copyBtn.addEventListener("click", () => {
  const text = `🚨 *PAANI DUTY ROAST* 🚨\nTarget: ${modalVictim.textContent}\nStatus: ${modalBadge.textContent}\n\n"${shayariLine1.textContent}\n${shayariLine2.textContent}"`;
  navigator.clipboard.writeText(text).then(() => {
    copyBtn.textContent = "Copied! 😂";
    setTimeout(() => { copyBtn.textContent = "Shayari Copy Karo 📋"; }, 2000);
  });
});

// Mode Switching
tabInstant.addEventListener("click", () => {
  if (isSpinning) return;
  currentMode = "instant";
  tabInstant.classList.add("active");
  tabSeries.classList.remove("active");
  seriesHud.style.display = "none";
  document.getElementById("boardTitle").textContent = "Live Score Counter";
});

tabSeries.addEventListener("click", () => {
  if (isSpinning) return;
  currentMode = "series";
  tabSeries.classList.add("active");
  tabInstant.classList.remove("active");
  seriesHud.style.display = "flex";
  document.getElementById("boardTitle").textContent = "10-Spins Battle Leaderboard";
  resetSeries();
});

function resetSeries() {
  currentSpinCount = 0;
  spinCounterPill.textContent = `0 / ${SERIES_MAX_SPINS}`;
  roster.forEach(n => scores[n] = 0);
  renderLeaderboard();
  suspenseText.textContent = "Match Reset! Spin karo!";
}

resetSeriesBtn.addEventListener("click", resetSeries);

window.addEventListener("resize", () => {
  fxCanvas.width = window.innerWidth;
  fxCanvas.height = window.innerHeight;
});

// Initialize
setupCanvasDPI();
renderTags();
</script>
